# dsh-archive-manager bundle patch: inserts the plugin row into the web
# plugin roster. The single row mounts BOTH halves: the host side
# (src/host/index.js → lib/index.js: archive list + unarchive routes) and
# the browser side (src/client/client.js → lib/client.js: sidebar entry,
# archive panel, restore interaction).
- insert:
    - id: archive-manager
      name: 'dsh-archive-manager'
